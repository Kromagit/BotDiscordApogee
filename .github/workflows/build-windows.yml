name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "bot.py"
      - "requirements.txt"
      - "requirements-build.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build ApogeeRaidHelperBot.exe
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "ApogeeRaidHelperBot" `
            --collect-all discord `
            --collect-all aiohttp `
            --collect-all dotenv `
            bot.py

      - name: Prepare downloadable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist\ApogeeRaidHelperBot.exe" "package\ApogeeRaidHelperBot.exe"
          Copy-Item ".env.example" "package\.env.example"
          Copy-Item "README.md" "package\README.md"
          Copy-Item "start_exe.bat" "package\start_exe.bat"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ApogeeRaidHelperBot-Windows
          path: package/
          if-no-files-found: error
          retention-days: 30
